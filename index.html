<!-- Корни виджетов: разметку вставляет src/app/mount-widgets.js -->
<header id="battle-bar" class="battle-bar" aria-label="Статус боя"></header>
<header id="hud" aria-hidden="true"></header>

<div id="game-container">

  <div id="buff-bar"></div>
  <div id="sale-boss-bar" aria-hidden="true">
    <span class="nm" id="sale-boss-name"></span>
    <div class="track"><div class="fill" id="sale-boss-fill"></div></div>
  </div>

  <!-- Джойстик и кнопки действий (виджет mobile-controls) -->
  <div id="mobile-controls-root"></div>

  <!-- Вылазка: рюкзак и кнопка действия -->

  <!-- Выбор апгрейда (виджет level-up-popup) -->

  <!-- Игровое меню (пауза / шестерёнка) -->

    <div id="game-menu-root"></div>
  </div>

  <!-- Настройки -->
  <div class="overlay" id="settings-overlay"></div>

  <!-- Итоги смены -->
  <div class="overlay end-overlay" id="end-overlay"></div>
</div>
